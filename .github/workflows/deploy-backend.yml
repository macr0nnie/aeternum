# Manual deploy of the Supabase backend (migrations + edge functions) to the
# hosted project. Run it from the Actions tab; leave "dry run" ticked first to
# see which migrations would apply.
# Required repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which migrations would apply
        type: boolean
        default: true

concurrency: deploy-backend

env:
  SUPABASE_PROJECT_REF: lswemgatrhamketsbnks
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list
      - name: Apply migrations
        run: supabase db push ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Deploy edge functions
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
